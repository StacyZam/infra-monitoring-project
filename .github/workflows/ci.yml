name: CI Pipeline
on:
  pull_request:
    branches: [ main ]
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Syntax check Bash scripts
        run: |
          bash -n check_api.sh
          bash -n analyze_logs.sh
      - name: Make scripts executable
        run: chmod +x check_api.sh analyze_logs.sh
      - name: Test check_api script
        run: |
          ./check_api.sh https://httpbin.org/status/200

